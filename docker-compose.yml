# OpenMRS O3 Reference Application - based on upstream docker-compose.yml at tag 3.7.1
# https://github.com/openmrs/openmrs-distro-referenceapplication/blob/3.7.1/docker-compose.yml
#
# Differences from upstream (keep this list current; everything else is upstream as-is):
#   - project name fixed to "openmrs-emr" (container/volume names never collide with other stacks)
#   - images pinned to release 3.7.1 BY DIGEST (upstream defaults to the moving "qa" tag).
#     Format tag@sha256:... - Docker uses only the digest; the tag is there for humans.
#     A digest identifies the exact image content and cannot change, unlike a tag.
#     To upgrade, see README "Upgrading".
#   - credentials required from .env, no fallback passwords
#   - host port configurable via HTTP_PORT
#   - db healthcheck reads credentials inside the container instead of interpolating them
#   - backend waits for db to be healthy, not just started
#   - OUR CONFIGURATION instead of the demo (see docs/configuration.md):
#       backend:  ./config/backend mounted over /openmrs/distribution/openmrs_config (read-only);
#                 the backend copies it into its data folder on every start, then Initializer loads it
#       frontend: ./config/frontend mounted at /usr/share/nginx/html/site (read-only), used via
#                 SPA_CONFIG_URLS (replaces config-core_demo.json); French as default language
#       gateway:  ./gateway/templates mounted at /etc/nginx/conf-templates (read-only), includes
#                 OpenMRS auth_request check for imaging and routes for /ohif and /dicom-web
#   - admin password from .env (OMRS_ADMIN_PASSWORD) instead of the public default
#   - time zone Africa/Algiers (UTC+1, no daylight saving) for both the JVM and MariaDB
#   - Phase 4 Imaging services:
#       orthanc:    Orthanc 26.9.1 PACS server with DICOMweb and PostgreSQL index
#       orthanc-db: PostgreSQL 16 Alpine for Orthanc index
#       ohif:       OHIF 3.13.12 zero-footprint web viewer under /ohif/
#
# Usage: cp .env.example .env  (fill it in), then  docker compose up -d
# UI: http://localhost/openmrs/spa    Legacy admin UI: http://localhost/openmrs
# OHIF Viewer: http://localhost/ohif/

name: openmrs-emr

services:
  gateway:
    image: openmrs/openmrs-reference-application-3-gateway:3.7.1@sha256:49070abbcda8aeced46f78ce0c1559236a2ba45bc624fe8485a59220cbd159a2
    restart: "unless-stopped"
    depends_on:
      - frontend
      - backend
      - orthanc
      - ohif
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./gateway/templates:/etc/nginx/conf-templates:ro
    deploy:
      resources:
        limits:
          memory: 128M

  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:3.7.1@sha256:f6b1f8443ab27a6b1c3944c5a948f2e0cdfea3701dcfd59316677fef28a58f8d
    restart: "unless-stopped"
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: /openmrs/spa/site/config-chu-blida.json
      SPA_DEFAULT_LOCALE: fr
    volumes:
      - ./config/frontend:/usr/share/nginx/html/site:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 5s
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    image: openmrs/openmrs-reference-application-3-backend:3.7.1@sha256:929cfe5dca5f221460e0f4a57abb9294614df5f74fbb3bb865e01b8dfe7a985b
    restart: "unless-stopped"
    depends_on:
      db:
        condition: service_healthy
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:?set OMRS_DB_USER in .env}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:?set OMRS_DB_PASSWORD in .env}
      # applied when the database is created (first start on an empty database)
      OMRS_ADMIN_USER_PASSWORD: ${OMRS_ADMIN_PASSWORD:?set OMRS_ADMIN_PASSWORD in .env}
      # the image's default JVM options plus the time zone
      OMRS_JAVA_SERVER_OPTS: "-Dfile.encoding=UTF-8 -server -Djava.security.egd=file:/dev/./urandom -Djava.awt.headless=true -Djava.awt.headlesslib=true -Duser.timezone=Africa/Algiers"
      TZ: Africa/Algiers
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
      timeout: 5s
    volumes:
      - openmrs-data:/openmrs/data
      - ./config/backend:/openmrs/distribution/openmrs_config:ro
    deploy:
      resources:
        limits:
          memory: 2560M

  # MariaDB - the database the O3 distribution is built and tested against
  db:
    image: mariadb:10.11.7@sha256:27292753bb759cd22be72e3c8192f1259ef47010c8634b5da0bc886845efe9fd
    restart: "unless-stopped"
    # +01:00 = Africa/Algiers (no daylight saving), same zone as the backend JVM
    command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --default-time-zone=+01:00"
    healthcheck:
      # $$ = evaluated inside the container, so the password is not written into the compose config
      test: "mysql --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --execute \"SHOW DATABASES;\""
      interval: 3s
      timeout: 1s
      retries: 5
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OMRS_DB_USER:?set OMRS_DB_USER in .env}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:?set OMRS_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 1024M

  # PostgreSQL 16 - database index for Orthanc PACS
  orthanc-db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: "unless-stopped"
    environment:
      POSTGRES_DB: ${ORTHANC_DB_NAME:?set ORTHANC_DB_NAME in .env}
      POSTGRES_USER: ${ORTHANC_DB_USER:?set ORTHANC_DB_USER in .env}
      POSTGRES_PASSWORD: ${ORTHANC_DB_PASSWORD:?set ORTHANC_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - orthanc-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  # Orthanc PACS server (26.9.1 / core 1.13.0) with PostgreSQL index and DICOMweb plugin
  orthanc:
    image: orthancteam/orthanc:26.9.1@sha256:d2705f2c56547e55ce9bc2250fd22d05d326493b3f3d9fa191ecb7db8ca6b5a2
    restart: "unless-stopped"
    depends_on:
      orthanc-db:
        condition: service_healthy
    environment:
      ORTHANC_AET: ${ORTHANC_AET:-ORTHANC}
      ORTHANC_DB_NAME: ${ORTHANC_DB_NAME:?set ORTHANC_DB_NAME in .env}
      ORTHANC_DB_USER: ${ORTHANC_DB_USER:?set ORTHANC_DB_USER in .env}
      ORTHANC_DB_PASSWORD: ${ORTHANC_DB_PASSWORD:?set ORTHANC_DB_PASSWORD in .env}
      POSTGRESQL_PLUGIN_ENABLED: "true"
      DICOM_WEB_PLUGIN_ENABLED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "false"
    ports:
      # DICOM C-STORE for hospital modalities / PACS network
      - "4242:4242"
    volumes:
      - ./config/orthanc:/etc/orthanc:ro
      - orthanc-storage:/var/lib/orthanc/storage
    deploy:
      resources:
        limits:
          memory: 1280M

  # OHIF Viewer 3.13.12 zero-footprint web medical imaging viewer
  ohif:
    image: ohif/app:v3.13.12@sha256:d9c875439ee682efb751c004ee9124405861633a5e7dd654f792e55a2dcce895
    restart: "unless-stopped"
    entrypoint:
      - /bin/sh
      - -c
      - |
        ln -sf /usr/share/nginx/html /usr/share/nginx/html/ohif && \
        sed -i -e 's|window.PUBLIC_URL="/"|window.PUBLIC_URL="/ohif/"|g' -e 's|src="/|src="/ohif/|g' -e 's|href="/|href="/ohif/|g' /usr/share/nginx/html/index.html && \
        gunzip -f /usr/share/nginx/html/app.bundle.*.js.gz && \
        sed -i 's|__webpack_require__\.p = "/"|__webpack_require__.p = "/ohif/"|g' /usr/share/nginx/html/app.bundle.*.js && \
        gzip -k -f /usr/share/nginx/html/app.bundle.*.js && \
        cp /etc/ohif/app-config.js /usr/share/nginx/html/app-config.js && \
        exec /usr/src/entrypoint.sh nginx -g 'daemon off;'
    volumes:
      - ./config/ohif:/etc/ohif:ro
    deploy:
      resources:
        limits:
          memory: 128M


volumes:
  openmrs-data: ~
  db-data: ~
  orthanc-db-data: ~
  orthanc-storage: ~
